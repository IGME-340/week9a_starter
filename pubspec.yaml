name: week9a_starter
description: "IGME-340 Week 9A: cached images, saved data, and opening links"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Today's three packages, already added for you. All three include Android
  # code, so adding one in the middle of class would mean stopping and
  # rebuilding the app each time.
  cached_network_image: ">=3.3.0 <4.0.0"
  shared_preferences: ">=2.2.0 <3.0.0"
  url_launcher: ">=6.2.0 <7.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
